name: Bug report
about: Overlay, hooks, or loot engine misbehaving
title: "[Bug] "
labels: bug
body:
  - type: markdown
    attributes:
      value: Please attach the output of `node %USERPROFILE%\.petdex\overlay\petdex.mjs doctor` when possible.
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options:
        - Codex
        - Cursor
        - Kimi Code
        - More than one
        - Other / none
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: doctor output / logs
